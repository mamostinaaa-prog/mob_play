{% extends 'base.html' %}
{% block title %}Список групп{% endblock %}

{% block content %}
<div class="container">
    <h1>Список групп</h1>

    <table>
        <thead>
            <tr>
                <th>Название</th>
                <th>Курс</th>
                <th>Кол-во студентов</th>
            </tr>
        </thead>
        <tbody>
            {% for group in groups %}
            <tr>
                <td>
                    <a href="{% url 'group_detail' %}?pk={{ group.pk }}">
                        {{ group.title }}
                    </a>
                </td>
                <td>{{ group.course }}</td>
                <td>{{ group.students.count }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3">Групп пока нет</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
